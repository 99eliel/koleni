name: Importar sistema base

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  importar:
    if: ${{ !contains(github.event.head_commit.message, '[base-importada]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copiar repositorio base
        run: |
          git clone --depth 1 https://github.com/99eliel/cor.git /tmp/cor-base
          rsync -a --exclude='.git' /tmp/cor-base/ ./

      - name: Commit da copia
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: copia sistema base [base-importada]' || exit 0
          git push origin main
