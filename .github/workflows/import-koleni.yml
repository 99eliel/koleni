name: Importar base do sistema Koleni

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  importar:
    if: "!contains(github.event.head_commit.message, '[koleni-importado]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Koleni
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clonar sistema base completo
        run: |
          rm -rf /tmp/cor-base
          git clone --depth 1 https://github.com/99eliel/cor.git /tmp/cor-base
          rsync -a --exclude='.git' /tmp/cor-base/ ./

      - name: Personalizar para Koleni
        run: |
          find . -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.css' -o -name '*.html' -o -name '*.md' -o -name '*.json' -o -name '*.yml' -o -name '*.yaml' \) -not -path './.git/*' -print0 | xargs -0 sed -i -e 's/personalizamartinpel/upagro-caa98/g' -e 's/Martinpel/Koleni/g' -e 's/MartinPel/Koleni/g' -e 's/MARTINPEL/KOLENI/g' -e 's/martinpel/koleni/g' -e 's#/cor/#/koleni/#g'
          [ -f src/martinpel-theme.css ] && mv src/martinpel-theme.css src/koleni-theme.css || true
          [ -f src/lib/martinpelLogo.js ] && mv src/lib/martinpelLogo.js src/lib/koleniLogo.js || true
          [ -f src/components/MartinpelBrand.jsx ] && mv src/components/MartinpelBrand.jsx src/components/KoleniBrand.jsx || true
          printf '%s' '' | base64 -d > src/lib/firebase.js
          printf '{\n  "projects": {\n    "default": "upagro-caa98"\n  }\n}\n' > .firebaserc
          sed -i 's#<meta name="theme-color" content="[^"]*" />#<meta name="theme-color" content="#ed1c24" />#' index.html
          sed -i 's#<title>.*</title>#<title>Gestão de Personalização | Koleni</title>#' index.html

      - name: Validar build
        run: |
          npm install
          npm run build

      - name: Gravar sistema completo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para gravar.'
          else
            git commit -m 'feat: sistema Koleni completo [koleni-importado]'
            git push origin main
          fi
